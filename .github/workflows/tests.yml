# On each push and pull request (plan step 3.3):
# - host: the portable core built natively with AddressSanitizer and UBSan, its unit tests, then the fake server's
#   scenarios against the host build ("make test" in CONTRIBUTING.md);
# - amiga: both Amiga executables (with tools/check-saves.py on their assembly) and the release archives in their
#   development form, built through tools/amiga-make.sh, which finds neither the toolchain nor a local script on the
#   runner and so takes its Docker way, the one documented for a new contributor.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Host build, unit tests, fake server scenarios
        run: make test

  amiga:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Amiga build and release archives (tools/amiga-make.sh, Docker)
        run: sh tools/amiga-make.sh all dist DEV=1
