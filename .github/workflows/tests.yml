# On each push and pull request:
# - host: the portable core built natively with AddressSanitizer and UBSan, its unit tests, then the fake server's
#   scenarios against the host build, and the C code's size and complexity ("make test" in CONTRIBUTING.md);
# - amiga: both Amiga executables (with tools/check-saves.py on their assembly), the developer tool cpucount (never
#   released) and the release archives in their development form, built through tools/amiga-make.sh, which finds neither the toolchain nor a local script on the
#   runner and so takes its Docker way, the one documented for a new contributor, with the image pinned there;
#   the .lha and the .zip are kept as the run's artifacts for 14 days, so that a development build can be tried without
#   building it (its version reads <next>-dev, never to be taken for a release; on a release commit, the release's
#   own number, hence the patterns without -dev).
# The actions are pinned by commit SHA (their version in a comment), as the image is by its digest; the checkout
# keeps no token (persist-credentials: false).
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false   # no git push here
      # lizard for tools/check-quality.py, at the versions and hashes of tools/requirements.txt, in a virtual
      # environment (the runner's Python may refuse packages installed outside one), put first in the PATH so that
      # make test's python3 is the environment's
      - name: lizard (tools/requirements.txt)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --require-hashes -r tools/requirements.txt
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Host build, unit tests, fake server scenarios
        run: make test

  amiga:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false   # no git push here: the token stays out of the directory the build's
                                       # container mounts
      - name: Amiga build, cpucount and release archives (tools/amiga-make.sh, Docker)
        run: sh tools/amiga-make.sh all cpucount dist DEV=1
      - name: SHA-256 of the executables (to compare with a local build from the same image)
        run: sha256sum out/amisqueeze out/amisqueeze.fpu
      # One artifact per archive, uploaded as it is (archive: false, one file each), so that the .lha is downloaded
      # ready for LhA on the Amiga rather than inside a zip; the artifact takes the file's name.
      - name: The .lha as the run's artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          path: out/amisqueeze-*.lha
          archive: false
          if-no-files-found: error
          retention-days: 14
      - name: The .zip as the run's artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          path: out/amisqueeze-*.zip
          archive: false
          if-no-files-found: error
          retention-days: 14
